services:
    # One-shot screenshotter (existing behaviour - run via `make screenshot/pdf`)
    screenshotter:
        image: ghcr.io/rondomondo/screenshot:${IMAGE_TAG:-latest}
        profiles: [oneshot]
        volumes:
            - ./screenshots:/screenshots
            - ./pdfs:/pdfs
            - ./html:/html:ro
            - ./workspace:/workspace

    # Long-lived MCP server - clients connect over HTTP/SSE on MCP_PORT (default 3000)
    mcp:
        image: ghcr.io/rondomondo/screenshot:${IMAGE_TAG:-latest}
        entrypoint:
            [
                'node',
                '/app/node_modules/playwright-core/cli.js',
                'mcp',
                '--headless',
                '--host',
                '0.0.0.0',
                '--port',
                '${MCP_PORT:-3000}',
                '--browser',
                'chromium',
                '--isolated',
                '--storage-state',
                '/workspace/sessions/${SESSION:-default}.json',
                '--allowed-hosts',
                '*',
                '--allow-unrestricted-file-access',
                '--executable-path',
                '/usr/bin/chromium',
            ]
        ports:
            - '${MCP_PORT:-3000}:${MCP_PORT:-3000}'
        volumes:
            - ./screenshots:/screenshots
            - ./pdfs:/pdfs
            - ./html:/html:ro
            - ./workspace:/workspace
        environment:
            - SESSION=${SESSION:-default}
            - MCP_PORT=${MCP_PORT:-3000}
        restart: unless-stopped
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'curl -fs --max-time 3 -X POST -H "Content-Type: application/json" -H "Accept: application/json, text/event-stream" -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"initialize\",\"params\":{\"protocolVersion\":\"2024-11-05\",\"capabilities\":{},\"clientInfo\":{\"name\":\"healthcheck\",\"version\":\"1\"}}}" http://localhost:${MCP_PORT:-3000}/mcp || exit 1',
                ]
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 15s
